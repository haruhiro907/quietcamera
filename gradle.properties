org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Use the standalone Kotlin Gradle plugin (libs.versions.toml) instead of
# AGP 9's built-in Kotlin, so the Kotlin version can track the latest stable.
android.builtInKotlin=false
# Keep Kotlin compilation in-process: one less local-socket daemon to rely on.
kotlin.compiler.execution.strategy=in-process
